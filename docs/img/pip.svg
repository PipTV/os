    <circle cx="256" cy="324" r="15" fill="#f5f7fa" stroke="#c4cad4" stroke-width="2"/>
    <circle cx="256" cy="324" r="5" fill="#0a84ff"/>
    <rect x="244" y="356" width="24" height="5" rx="2.5" fill="#aab2be"/>
    <rect x="244" y="370" width="24" height="5" rx="2.5" fill="#aab2be"/>
